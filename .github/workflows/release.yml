name: Release & Publish

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/pre-release-tests.yml

  build:
    needs: test
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    concurrency:
      group: build-${{ matrix.platform }}
      cancel-in-progress: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-${{ matrix.platform }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.platform }}-buildx-
          fail_ci_cache_error: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      # Every platform builds on a runner of its own architecture, so node, npm
      # and the native prebuilds run natively. Emulating arm64 with QEMU crashes
      # those binaries with SIGILL and leaves buildx waiting on a dead step.
      - name: Build and Push Docker Image
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION=${VERSION#v}

          docker buildx build \
            --platform ${{ matrix.platform }} \
            --cache-from type=local,src=/tmp/.buildx-cache \
            --cache-to type=local,dest=/tmp/.buildx-cache-new,mode=max \
            --tag ${{ secrets.DOCKER_USERNAME }}/3proxy-ui:${VERSION}-${{ matrix.arch }} \
            --push .

          # The cache is promoted to the saved key only after a successful build,
          # so an interrupted or failed build can never poison the next release.
          rm -rf /tmp/.buildx-cache /tmp/.buildx-cache-new
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

  publish:
    # Runs only after both architectures reached Docker Hub, so a published
    # release always points at a complete multi-arch image.
    needs: [test, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: publish
      cancel-in-progress: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Merge platforms into a multi-arch manifest
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION=${VERSION#v}

          docker buildx imagetools create \
            --tag ${{ secrets.DOCKER_USERNAME }}/3proxy-ui:${VERSION} \
            --tag ${{ secrets.DOCKER_USERNAME }}/3proxy-ui:latest \
            ${{ secrets.DOCKER_USERNAME }}/3proxy-ui:${VERSION}-amd64 \
            ${{ secrets.DOCKER_USERNAME }}/3proxy-ui:${VERSION}-arm64

      - name: Verify the image is on Docker Hub
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION=${VERSION#v}

          # The release below only runs once this succeeds, so a failed or skipped
          # push can never leave a published release pointing at a missing image.
          RETRIES=30
          until [ "$RETRIES" -eq 0 ]; do
            if docker buildx imagetools inspect \
                 "${{ secrets.DOCKER_USERNAME }}/3proxy-ui:$VERSION" >/dev/null 2>&1; then
              echo "Image ${{ secrets.DOCKER_USERNAME }}/3proxy-ui:$VERSION is available"
              exit 0
            fi
            RETRIES=$((RETRIES - 1))
            echo "Image not visible yet, retrying (${RETRIES} left)..."
            sleep 10
          done

          echo "::error::Image ${{ secrets.DOCKER_USERNAME }}/3proxy-ui:$VERSION is not on Docker Hub"
          exit 1

      - name: Sync README to Docker Hub
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
          repository: ${{ secrets.DOCKER_USERNAME }}/3proxy-ui
          readme-filepath: ./DOCKER.md
          short-description: "3proxy Admin UI - Web-based administration interface for 3proxy servers"

  release:
    # Runs only after the image is actually on Docker Hub, so a published
    # release always has a downloadable image behind it.
    needs: [test, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: release
      cancel-in-progress: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
              --repo="$GITHUB_REPOSITORY" \
              --title="${TAG#v}" \
              --generate-notes
