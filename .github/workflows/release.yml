name: Release & Publish

on:
  workflow_run:
    workflows: ["Pre-Release Tests"]
    types:
      - completed

permissions:
  contents: write

jobs:
  release:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Get tag from the triggering workflow run
          TAG="${{ github.event.workflow_run.ref_name }}"
          if [ -z "$TAG" ]; then
            TAG=$(git describe --tags --exact-match HEAD 2>/dev/null || git tag --sort=-v:refname | head -1)
          fi
          echo "Releasing tag: $TAG"
          gh release create "$TAG" \
              --repo="$GITHUB_REPOSITORY" \
              --title="${TAG#v}" \
              --generate-notes

  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    concurrency:
      group: publish
      cancel-in-progress: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and Push Docker Image
        run: |
          # Get tag from the triggering workflow run
          TAG="${{ github.event.workflow_run.ref_name }}"
          if [ -z "$TAG" ]; then
            TAG=$(git describe --tags --exact-match HEAD 2>/dev/null || git tag --sort=-v:refname | head -1)
          fi
          VERSION=${TAG#v}
          echo "Building Docker image for version: $VERSION"

          docker buildx build \
            --platform linux/amd64 \
            --tag ${{ secrets.DOCKER_USERNAME }}/3proxy-ui:$VERSION \
            --tag ${{ secrets.DOCKER_USERNAME }}/3proxy-ui:latest \
            --push .

      - name: Sync README to Docker Hub
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
          repository: ${{ secrets.DOCKER_USERNAME }}/3proxy-ui
          readme-filepath: ./DOCKER.md
          short-description: "3proxy Admin UI - Web-based administration interface for 3proxy servers"
