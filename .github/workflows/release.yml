name: Release & Publish

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
        run: |
          gh release create "$tag" \
              --repo="$GITHUB_REPOSITORY" \
              --title="${tag#v}" \
              --generate-notes

  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and Push Docker Image
        run: |
          VERSION=${{ github.ref_name }}
          VERSION=${VERSION#v} # Remove leading 'v' if it exists

          docker buildx build \
            --platform linux/amd64 \
            --tag hungryking/3proxy-admin:$VERSION \
            --tag hungryking/3proxy-admin:latest \
            --push .

      - name: Sync README to Docker Hub
        run: |
          # Get Docker Hub token
          TOKEN=$(curl -s -X POST https://hub.docker.com/v2/users/login \
            -H "Content-Type: application/json" \
            -d '{"username":"'"${{ secrets.DOCKER_USERNAME }}"'","password":"'"${{ secrets.DOCKER_TOKEN }}"'"}' \
            | jq -r '.token')

          # Update repository description with DOCKER.md content
          DESCRIPTION=$(cat DOCKER.md | python3 -c "import sys,json; print(json.dumps(sys.stdin.read()))")

          curl -s -X PATCH "https://hub.docker.com/v2/repositories/hungryking/3proxy-admin/" \
            -H "Authorization: JWT $TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"full_description":'"$DESCRIPTION"'}'
