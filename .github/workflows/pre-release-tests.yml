name: Pre-Release Tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache Node.js modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm install

      - name: Copy environment file
        run: cp .env.example .env

      - name: Set up database
        run: |
          npx prisma migrate deploy
          npx prisma generate

      - name: Compile scripts
        run: npm run compile

      - name: Run unit tests
        run: npm run test:unit

      - name: Run integration tests
        run: npm run test:integration

      - name: Run fail2ban config tests
        run: npm run test:fail2ban

  e2e:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache Node.js modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Copy environment file
        run: cp .env.example .env

      - name: Report Docker version
        run: docker version

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload E2E logs on failure
        if: failure()
        run: |
          docker ps -a
          docker compose -p 3proxy-e2e-test -f tests/e2e/docker-compose.e2e.yml logs --no-color || true
